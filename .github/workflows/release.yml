# .github/workflows/release.yml
# リリースタグ作成時にAPKをビルドし、GitHub Releaseにアップロードする
# 注意: 現在のAPKは開発確認用（debug署名）です。ストア公開用ではありません。
# タグ例: v0.6.3

name: Build Preview APK (dev confirmation)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Rename APK for preview clarity
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-release-preview.apk

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: build/app/outputs/flutter-apk/app-release-preview.apk
          generate_release_notes: true
