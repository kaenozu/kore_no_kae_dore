# .github/workflows/ci.yml
# CI: analyze, test, build debug APK
# PR / master push / workflow_dispatch で実行
# Gemini APIキー不要（Mock fallbackで動作）
# 注意: debug APKは開発確認用。ストア公開用ではない。

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/kore-no-kae-dore-debug-preview.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kore-no-kae-dore-debug-preview-apk
          path: build/app/outputs/flutter-apk/kore-no-kae-dore-debug-preview.apk
